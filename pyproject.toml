[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avf-spline-generator"
version = "0.2.0"
description = "Trace H/V fibre predictions into AFV splines"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "numba>=0.59,<0.65", "filelock>=3.12"]

[project.optional-dependencies]
zarr = ["zarr>=2.16,<3"]
compressed = ["zarr>=2.16,<3", "numcodecs>=0.12,<0.16"]
test = ["pytest>=7", "zarr>=2.16,<3", "numcodecs>=0.12,<0.16"]

[project.scripts]
avf-spline-generator = "avf_spline_generator.cli:main"

[project.urls]
Repository = "https://github.com/Qualzz/AVF_SPLINE_GENERATOR"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
